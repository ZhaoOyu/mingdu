name: Bug report / 问题反馈
description: Report a reproducible problem with Mingdu
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS version, CPU architecture, Mingdu version, monitor model and connection (HDMI/DP/dock).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断
      description: Paste the diagnostic panel or --diagnose output. Remove serial numbers, device IDs and personal paths before posting.
      render: text
